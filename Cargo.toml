[package]
name = "delegatable_ecdsa"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
plonky2 = { path = "libs/plonky2/plonky2", features = ["timing"] }
plonky2_ecdsa = { path = "libs/plonky2_ecdsa" }
plonky2_sha256 = { path = "libs/plonky2_sha256" }

# Note: bincode 1.3 used for compatibility with plonky2-ecdsa ecosystem
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["preserve_order"] }
clap = { version = "4.5.45", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
hashbrown = "0.14.5"

[patch."https://github.com/0xPolygonZero/plonky2"]
plonky2_field       = { path = "libs/plonky2/field" }
plonky2_maybe_rayon = { path = "libs/plonky2/maybe_rayon" }
plonky2             = { path = "libs/plonky2/plonky2" }
plonky2_util        = { path = "libs/plonky2/util" }

[patch."https://github.com/0xPARC/plonky2"]
plonky2_field       = { path = "libs/plonky2/field" }
plonky2_maybe_rayon = { path = "libs/plonky2/maybe_rayon" }
plonky2             = { path = "libs/plonky2/plonky2" }
plonky2_util        = { path = "libs/plonky2/util" }

[dependencies.anyhow]
version = "1.0.99"

[[bench]]
name = "bench_jwt"
path = "benches/bench_jwt.rs"
harness = false
